org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template. Flutter 3.44 pins it
# to false so that unmigrated Flutter-SDK plugins (integration_test) keep working;
# do not flip it to true expecting the KGP warning below to go away.
android.builtInKotlin=false
# Every Android build prints:
#
#   WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin
#   (KGP): flutter_timezone
#
# This is a false positive and the build is not at risk. Flutter's check
# (FlutterPluginUtils.detectApplyingKotlinGradlePlugin) reads each plugin's
# build.gradle as *text* and regex-matches "apply plugin: 'kotlin-android'"; it
# never evaluates the code, and it fires whenever AGP major >= 9 (we are on 9.0.1).
# flutter_timezone 5.1.0 already migrated for AGP 9 -- it guards that line behind
# "if (agpMajor < 9 || !builtInKotlinEnabled)", so under AGP 9 it does not apply
# KGP -- but the text is still on the line, so the detector reports it anyway.
#
# There is no upgrade that fixes this: 5.1.0 is the latest on pub.dev and upstream
# main carries the identical file. The plugin is required -- reminder_scheduler.dart
# uses it for tz.setLocalLocation so notifications fire on wall-clock time.
# Silencing it would mean vendoring a patched copy of the package or downgrading
# AGP, neither of which is worth it for a cosmetic log line.
#
# Re-check when Flutter's detector stops being purely textual, or when
# flutter_timezone restructures its build.gradle (e.g. pluginManager.apply).
# Kotlin's incremental compiler cannot close its caches under this project path
# ("Could not close incremental caches ... class-fq-name-to-source.tab"), which
# fails every plugin's compileDebugKotlin task. Disabling incremental Kotlin
# compilation is the supported workaround; revisit after a Kotlin upgrade.
kotlin.incremental=false
